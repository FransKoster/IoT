esphome:
  name: bmp280-d1-mini
  friendly_name: BMP280 D1 Mini

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP if Wi-Fi connection fails
  ap:
    ssid: "Bmp280-D1-Mini"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: D2
  scl: D1
  scan: true

sensor:
  - platform: bmp280_i2c
    address: 0x77
    update_interval: 30s
    temperature:
      name: "BMP280 Temperature"
      oversampling: 16x
    pressure:
      name: "BMP280 Pressure"
      oversampling: 16x