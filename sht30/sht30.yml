esphome:
  name: sht30-d1-mini
  friendly_name: SHT30 D1 Mini

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP if Wi-Fi connection fails
  ap:
    ssid: "Bmp280-D1-Mini"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  sda: D2
  scl: D1
  scan: true

sensor:
  - platform: sht3xd
    address: 0x45
    update_interval: 30s
    temperature:
      name: "SHT30 Temperature"
    humidity:
      name: "SHT30 Humidity"