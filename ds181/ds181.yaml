esphome:
  name: ds181multi
  friendly_name: "DS181 Multi"

esp8266:
  board: huzzah

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

one_wire:
  - platform: gpio
    pin: GPIO2

sensor:
  - platform: dallas_temp
    address: 0x09030297793DD828
    name: "temp 1"
    update_interval: 30s
  - platform: dallas_temp
    address: 0x78030297792E1C28
    name: "temp 2"
    update_interval: 30s
  - platform: dallas_temp
    address: 0xF40302977914AA28
    name: "temp 3"
    update_interval: 30s
  - platform: dallas_temp
    address: 0xB2030297791A5328
    name: "temp 4"
    update_interval: 30s
  - platform: dallas_temp
    address: 0x3C0302977938B728
    name: "temp 5"
    update_interval: 30s
