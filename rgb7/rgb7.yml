esphome:
  name: rgb7-d1-mini
  friendly_name: RGB7 D1 Mini

esp8266:
  board: d1_mini

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP if Wi-Fi connection fails
  ap:
    ssid: "Rgb7-D1-Mini"
    password: !secret fallback_ap_password

captive_portal:

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: D4
    num_leds: 7
    name: "RGB7"

