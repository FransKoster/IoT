esphome:
  name: esp32-cam
  friendly_name: ESP32-CAM
# ESP32-S with ESP32-CAM-MB
esp32:
  board: esp32dev
  variant: esp32

psram:

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP if Wi-Fi connection fails
  ap:
    ssid: "ESP32-CAM"
    password: !secret fallback_ap_password

captive_portal:

esp32_camera:
  name: ESP32-CAM
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  power_down_pin: GPIO32
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  resolution: VGA
  jpeg_quality: 10

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot
